[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "taiji"
version = "0.1.0"
description = "Yin/yang architecture search runtime for self-contained research units"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anyio>=4",
    "torch>=2.5",
]

[project.optional-dependencies]
agent = [
    "claude-agent-sdk",
]

[project.scripts]
taiji-cycle = "taiji.cycle:main"
taiji-loop = "taiji.loop:main"
taiji-watch = "taiji.watch:main"
taiji-smoke = "taiji.smoke:main"
